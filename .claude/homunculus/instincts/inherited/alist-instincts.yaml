# Alist Workflow Add Or Update Driver

## Action

Follow the add-or-update-driver workflow:
1. Create or update driver implementation file (drivers/<driver>/driver.go)
2. Create or update driver meta file (drivers/<driver>/meta.go)
3. Create or update types file (drivers/<driver>/types.go)
4. Create or update utility/helper file (drivers/<driver>/util.go)
5. Optionally, update drivers/all.go to register the new driver

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: drivers/*/driver.go, drivers/*/meta.go, drivers/*/types.go

